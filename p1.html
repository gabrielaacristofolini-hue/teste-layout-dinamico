<!doctype html>
<!--
  ==================== P1 ====================
  URL única para todas as presells. Lê a utm_source da URL e mostra o
  Layout 1, 2 ou 3 (cada layout é um bloco <template> mais abaixo).
  Qual source abre qual layout: CONFIG, no <script> no fim do arquivo.
-->
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>P1 de teste</title>
  <style>
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      line-height: 1.4;
      color: #18181b;
      background: #fff;
    }

    /* ---------- Base comum aos layouts ---------- */
    .layout { min-height: 100vh; padding: 32px 16px; background: var(--fundo); }
    .card {
      max-width: 480px;
      margin: 0 auto;
      padding: 24px;
      background: #fff;
      border-top: 6px solid var(--cor);
      border-radius: 12px;
      box-shadow: 0 1px 3px rgba(0, 0, 0, .1);
    }
    .selo {
      display: inline-block; margin-bottom: 12px; padding: 4px 10px;
      font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase;
      color: #fff; background: var(--cor); border-radius: 99px;
    }
    h1 { margin: 0 0 8px; font-size: 26px; color: var(--cor-escura); }
    h2 { margin: 0 0 8px; font-size: 20px; color: var(--cor-escura); }
    p { margin: 0 0 20px; color: #52525b; }
    .pergunta { margin: 0 0 12px; font-weight: 600; color: #18181b; }
    .opcao {
      display: block; width: 100%; margin-bottom: 10px; padding: 14px 16px;
      font: inherit; font-size: 16px; text-align: left; cursor: pointer;
      color: inherit; background: #fff; border: 1px solid #d4d4d8; border-radius: 8px;
    }
    .opcao:hover { border-color: var(--cor); background: var(--fundo); }
    .resumo { margin: 0; font-size: 14px; word-break: break-all; }

    /* ---------- Cores de cada layout ---------- */
    .layout-1 { --cor: #1d4ed8; --cor-escura: #1e3a8a; --fundo: #dbeafe; } /* azul */
    .layout-2 { --cor: #15803d; --cor-escura: #14532d; --fundo: #dcfce7; } /* verde */
    .layout-3 { --cor: #c2410c; --cor-escura: #7c2d12; --fundo: #ffedd5; } /* laranja */

    /* Etiqueta de diagnóstico (canto inferior esquerdo) */
    #debug {
      position: fixed; left: 8px; bottom: 8px; max-width: calc(100% - 16px);
      padding: 6px 10px; border-radius: 6px;
      font: 12px/1.4 ui-monospace, Consolas, monospace; word-break: break-all;
      color: #fff; background: rgba(0, 0, 0, .8);
    }

    /* Bloqueio quando a URL chega sem utm_source: fundo totalmente preto + alerta branco */
    #bloqueio {
      position: fixed; inset: 0; z-index: 1000;
      display: flex; align-items: center; justify-content: center; padding: 16px;
      background: #000;
    }
    .alerta {
      width: 100%; max-width: 400px; padding: 24px;
      text-align: center; background: #fff; border-radius: 12px;
    }
    .alerta h2 { margin: 0 0 8px; font-size: 20px; color: #18181b; overflow-wrap: anywhere; }
    .alerta p { margin: 0 0 16px; color: #52525b; }
    .alerta code { padding: 1px 5px; font: 13px ui-monospace, Consolas, monospace; background: #f4f4f5; border-radius: 4px; }
    .alerta-opcoes { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
    .alerta-opcoes a {
      padding: 10px 14px; font-weight: 600; text-decoration: none;
      color: #fff; background: #18181b; border-radius: 8px;
    }
    html.bloqueada, html.bloqueada body { overflow: hidden; }
  </style>
</head>
<body>
  <!-- O layout escolhido pela utm_source é colocado aqui. -->
  <div id="app"></div>
  <div id="debug" hidden></div>

  <!-- Alerta que cobre a página quando a URL chega sem utm_source. -->
  <div id="bloqueio" hidden>
    <div class="alerta" role="alertdialog" aria-modal="true" aria-labelledby="alerta-titulo" aria-describedby="alerta-texto">
      <h2 id="alerta-titulo">Falta a utm_source na URL</h2>
      <p id="alerta-texto">Esta página só abre com uma utm_source cadastrada. Escolha uma abaixo ou coloque na URL, por exemplo: <code>?utm_source=source1</code></p>
      <div class="alerta-opcoes"></div>
    </div>
  </div>

  <!-- ===================== LAYOUT 1 · AZUL ===================== -->
  <template id="layout-1">
    <div class="layout layout-1">
      <main class="card">
        <span class="selo">Layout 1</span>
        <h1>Este é o Layout 1</h1>
        <p>Texto genérico de teste. Aqui entra o conteúdo com a cara da presell 1.</p>
        <div class="pergunta-final">
          <p class="pergunta">Última pergunta de teste?</p>
          <button class="opcao" type="button">Opção A</button>
          <button class="opcao" type="button">Opção B</button>
          <button class="opcao" type="button">Opção C</button>
        </div>
        <div class="resultado" hidden>
          <h2>Resposta registrada!</h2>
          <p class="resumo"></p>
        </div>
      </main>
    </div>
  </template>

  <!-- ===================== LAYOUT 2 · VERDE ===================== -->
  <template id="layout-2">
    <div class="layout layout-2">
      <main class="card">
        <span class="selo">Layout 2</span>
        <h1>Este é o Layout 2</h1>
        <p>Texto genérico de teste. Aqui entra o conteúdo com a cara da presell 2.</p>
        <div class="pergunta-final">
          <p class="pergunta">Última pergunta de teste?</p>
          <button class="opcao" type="button">Opção A</button>
          <button class="opcao" type="button">Opção B</button>
          <button class="opcao" type="button">Opção C</button>
        </div>
        <div class="resultado" hidden>
          <h2>Resposta registrada!</h2>
          <p class="resumo"></p>
        </div>
      </main>
    </div>
  </template>

  <!-- ===================== LAYOUT 3 · LARANJA ===================== -->
  <template id="layout-3">
    <div class="layout layout-3">
      <main class="card">
        <span class="selo">Layout 3</span>
        <h1>Este é o Layout 3</h1>
        <p>Texto genérico de teste. Aqui entra o conteúdo com a cara da presell 3.</p>
        <div class="pergunta-final">
          <p class="pergunta">Última pergunta de teste?</p>
          <button class="opcao" type="button">Opção A</button>
          <button class="opcao" type="button">Opção B</button>
          <button class="opcao" type="button">Opção C</button>
        </div>
        <div class="resultado" hidden>
          <h2>Resposta registrada!</h2>
          <p class="resumo"></p>
        </div>
      </main>
    </div>
  </template>

  <script>
    // ============================ CONFIGURAÇÃO ============================
    const CONFIG = {
      // Qual layout cada utm_source abre. Escreva as sources em minúsculas
      // (a comparação ignora maiúsculas). Várias sources podem usar o mesmo layout.
      layoutPorSource: {
        source1: 'layout-1',
        source2: 'layout-2',
        source3: 'layout-3',
      },
      // Layout para source fora da lista. Só é usado se o bloqueio abaixo estiver desligado.
      layoutPadrao: 'layout-1',
      // Etiqueta no canto da tela mostrando a source lida. Mude para false na operação.
      mostrarDebug: true,
      // Sem utm_source na URL, ou com uma que não está na lista acima:
      // cobre a página com fundo preto e um alerta, e bloqueia tudo.
      bloquearSemSource: true,
    };
    // =====================================================================

    const params = new URLSearchParams(location.search);
    const source = (params.get('utm_source') || '').trim().toLowerCase();
    const conhecida = Object.prototype.hasOwnProperty.call(CONFIG.layoutPorSource, source);

    let layoutId = conhecida ? CONFIG.layoutPorSource[source] : CONFIG.layoutPadrao;
    if (!document.getElementById(layoutId)) layoutId = CONFIG.layoutPadrao;

    // Coloca na página só o HTML do layout escolhido.
    const app = document.getElementById('app');
    app.appendChild(document.getElementById(layoutId).content.cloneNode(true));

    if (CONFIG.mostrarDebug) {
      const debug = document.getElementById('debug');
      debug.textContent = 'utm_source: ' + (source || '(vazia)') + ' → ' + layoutId + (conhecida ? '' : ' (padrão)');
      debug.hidden = false;
    }

    // Sem utm_source, ou com uma que não está no CONFIG: mostra o alerta, com um botão
    // para cada source cadastrada, e trava a página de trás (sem clique, teclado ou rolagem).
    if (!conhecida && CONFIG.bloquearSemSource) {
      if (source) {
        document.getElementById('alerta-titulo').textContent = 'utm_source "' + source + '" não reconhecida';
      }
      const opcoes = document.querySelector('.alerta-opcoes');
      Object.keys(CONFIG.layoutPorSource).forEach((nome) => {
        const url = new URL(location.href);
        url.searchParams.set('utm_source', nome);
        const link = document.createElement('a');
        link.href = url.href;
        link.textContent = nome;
        opcoes.appendChild(link);
      });
      app.inert = true;
      document.documentElement.classList.add('bloqueada');
      document.getElementById('bloqueio').hidden = false;
    }

    // Última pergunta: ao clicar numa opção, mostra a resposta (só para o teste).
    app.querySelectorAll('.opcao').forEach((botao) => {
      botao.addEventListener('click', () => {
        const resposta = botao.textContent.trim();

        // AQUI entra o próximo passo da operação (ex.: levar para a página monetizada).
        console.log('Resposta (teste):', { resposta, utm_source: source || '(vazia)', layout: layoutId });

        app.querySelector('.pergunta-final').hidden = true;
        const resultado = app.querySelector('.resultado');
        resultado.querySelector('.resumo').textContent =
          'Resposta: ' + resposta + ' · utm_source: ' + (source || '(vazia)') + ' · ' + layoutId;
        resultado.hidden = false;
      });
    });
  </script>
</body>
</html>
